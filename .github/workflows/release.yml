name: Release

on:
  push:
    tags:
      - 'aiutils-v*'
      - 'sk-v*'

jobs:
  release-aiutils:
    name: Publish DimonSmart.AiUtils
    if: startsWith(github.ref, 'refs/tags/aiutils-v')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Extract version from tag
      id: extract_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/aiutils-v}" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore DimonSmart.AiUtils/DimonSmart.AiUtils.csproj

    - name: Build project
      run: dotnet build DimonSmart.AiUtils/DimonSmart.AiUtils.csproj --configuration Release --no-restore -p:Version=${{ steps.extract_version.outputs.VERSION }} -p:PackageVersion=${{ steps.extract_version.outputs.VERSION }}

    - name: Create NuGet package
      run: dotnet pack DimonSmart.AiUtils/DimonSmart.AiUtils.csproj --configuration Release --no-build -p:Version=${{ steps.extract_version.outputs.VERSION }} -p:PackageVersion=${{ steps.extract_version.outputs.VERSION }} --output ./artifacts

    - name: Upload NuGet package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-dimonsmart-aiutils
        path: ./artifacts/*.nupkg

    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release-semantic-kernel:
    name: Publish DimonSmart.AiUtils.SemanticKernel
    if: startsWith(github.ref, 'refs/tags/sk-v')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Extract version from tag
      id: extract_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/sk-v}" >> $GITHUB_OUTPUT

    - name: Restore dependencies
      run: dotnet restore DImonSmart.AiUtils.SemanticKernel/DImonSmart.AiUtils.SemanticKernel.csproj

    - name: Build project
      run: dotnet build DImonSmart.AiUtils.SemanticKernel/DImonSmart.AiUtils.SemanticKernel.csproj --configuration Release --no-restore -p:Version=${{ steps.extract_version.outputs.VERSION }} -p:PackageVersion=${{ steps.extract_version.outputs.VERSION }}

    - name: Create NuGet package
      run: dotnet pack DImonSmart.AiUtils.SemanticKernel/DImonSmart.AiUtils.SemanticKernel.csproj --configuration Release --no-build -p:Version=${{ steps.extract_version.outputs.VERSION }} -p:PackageVersion=${{ steps.extract_version.outputs.VERSION }} --output ./artifacts

    - name: Upload NuGet package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-dimonsmart-aiutils-semantickernel
        path: ./artifacts/*.nupkg

    - name: Publish to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
